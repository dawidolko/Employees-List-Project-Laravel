name: employeeslist-project

services:
  mysql:
    image: mysql:8.0
    container_name: employeeslist-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: employees
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database:/docker-entrypoint-initdb.d:ro
    networks:
      - employeeslist-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M

  app:
    build:
      context: ../..
      dockerfile: .tools/docker/Dockerfile
    container_name: employeeslist-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=employees
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=laravel_password
    ports:
      - "8000:80"
    volumes:
      - ../../backend:/var/www/html
      - storage_data:/var/www/html/storage
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - employeeslist-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for MySQL..."
        sleep 15
        echo "Installing Composer dependencies..."
        composer install --no-interaction --optimize-autoloader --no-dev
        if [ ! -f .env ]; then
          cp .env.example .env
        fi
        if ! grep -qP "APP_KEY=.+" .env; then
          php artisan key:generate --force
        fi
        sed -i 's/DB_HOST=.*/DB_HOST=mysql/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=employees/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=laravel_user/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=laravel_password/' .env
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
        chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
        rm -rf /var/www/html/bootstrap/cache/*.php
        php artisan storage:link 2>/dev/null || true
        echo "Running Laravel migrations..."
        php artisan migrate --force
        echo "✓ Application ready!"
        /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64
    container_name: employeeslist-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 256M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - employeeslist-network

networks:
  employeeslist-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
